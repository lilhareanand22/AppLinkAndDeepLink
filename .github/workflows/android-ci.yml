# ==============================================================================
# GitHub Actions CI Workflow for AppLinkAndDeepLink
# Triggers on Pull Requests targeting the 'master' branch
#
# Stages:
#   Stage 2: Build & Compilation    → :app:assembleDebug
#   Stage 3: Testing & Coverage     → :app:testDebugUnitTest + :app:jacocoTestReport
#   Stage 4: Code Formatting        → :app:ktlintCheck
#   Stage 5: Static Analysis        → :app:detekt
#   Stage 6: Platform Quality       → :app:lintDebug
#   Stage 7: Software Composition   → :app:dependencyCheckAnalyze
# ==============================================================================

name: Android CI - Pull Request Verification

on:
  push:
    branches:
      - git-action-setup
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"'

jobs:
  # ============================================================================
  # Stage 2: Build & Compilation
  # ============================================================================
  build:
    name: 'Stage 2: Build & Compilation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ============================================================================
  # Stage 3: Testing & Coverage
  # ============================================================================
  test:
    name: 'Stage 3: Testing & Coverage'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Unit, Robolectric & Konsist Tests with JaCoCo Coverage
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport

      - name: Publish JUnit Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 'Unit & Robolectric Test Results'
          path: 'app/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload JUnit XML Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Upload Test HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 14

  # ============================================================================
  # Stage 4: Code Formatting (ktlint)
  # ============================================================================
  ktlint:
    name: 'Stage 4: Code Formatting (ktlint)'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run ktlintCheck
        run: ./gradlew :app:ktlintCheck

  # ============================================================================
  # Stage 5: Static Analysis (Detekt)
  # ============================================================================
  detekt:
    name: 'Stage 5: Static Analysis (Detekt)'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Detekt Static Analysis
        run: ./gradlew :app:detekt

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/detekt.html
          retention-days: 14

  # ============================================================================
  # Stage 6: Platform Quality (Android Lint)
  # ============================================================================
  lint:
    name: 'Stage 6: Platform Quality (Android Lint)'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Android Lint (lintDebug)
        run: ./gradlew :app:lintDebug

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  # ============================================================================
  # Stage 7: Software Composition Analysis (OWASP)
  # ============================================================================
  dependency-check:
    name: 'Stage 7: Software Composition (OWASP)'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache OWASP NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run OWASP Dependency-Check Analysis
        run: ./gradlew :app:dependencyCheckAnalyze

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: app/build/reports/dependency-check-report.html
          retention-days: 14

  # ============================================================================
  # Final Status Gate: Summary of All Quality Checks
  # ============================================================================
  verification-summary:
    name: 'Verification Summary'
    runs-on: ubuntu-latest
    if: always()
    needs: [build, test, ktlint, detekt, lint, dependency-check]
    steps:
      - name: Summarize Verification Results
        run: |
          echo "================================================================"
          echo "     PULL REQUEST VERIFICATION SUMMARY"
          echo "================================================================"
          echo ""
          echo "Stage 2 - Build & Compilation     : ${{ needs.build.result }}"
          echo "Stage 3 - Testing & Coverage       : ${{ needs.test.result }}"
          echo "Stage 4 - Code Formatting (ktlint) : ${{ needs.ktlint.result }}"
          echo "Stage 5 - Static Analysis (Detekt) : ${{ needs.detekt.result }}"
          echo "Stage 6 - Platform Quality (Lint)  : ${{ needs.lint.result }}"
          echo "Stage 7 - Software Composition     : ${{ needs.dependency-check.result }}"
          echo ""
          echo "================================================================"

      - name: Fail If Any Quality Gate Failed
        if: |
          needs.build.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.ktlint.result == 'failure' ||
          needs.detekt.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.dependency-check.result == 'failure'
        run: |
          echo "❌ One or more verification stages failed. Pull request cannot be merged."
          exit 1

      - name: All Quality Gates Passed
        if: |
          needs.build.result == 'success' &&
          needs.test.result == 'success' &&
          needs.ktlint.result == 'success' &&
          needs.detekt.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.dependency-check.result == 'success'
        run: echo "✔ All 6 verification stages passed. Pull request is safe to merge."
