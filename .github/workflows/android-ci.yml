# ==============================================================================
# GitHub Actions CI Workflow for AppLinkAndDeepLink
# Fail-Fast Tiered PR Verification
#
# Pipeline Structure:
#   Tier 1 (Fast Static Gates, ~15–30s):
#     - Stage 1: Code Formatting       → :app:ktlintCheck
#     - Stage 2: Static Analysis       → :app:detekt
#   Tier 2 (Testing & Quality, ~1–2m):
#     - Stage 3: Testing & Coverage    → :app:testDebugUnitTest + :app:jacocoTestReport
#     - Stage 4: Platform Quality      → :app:lintDebug
#   Tier 3 (Compilation & Packaging, ~2m):
#     - Stage 5: Build & Compilation   → :app:assembleDebug
#   Tier 4 (Final PR Merge Gate):
#     - Verification Summary
# ==============================================================================

name: Android CI - Pull Request Verification

on:
  push:
    branches:
      - git-action-setup
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # TIER 1: Fast Static Gates (Fail Fast in <30s)
  # ============================================================================
  code-style:
    name: 'Stage 1: Code Formatting (ktlint)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Run ktlintCheck
        run: ./gradlew :app:ktlintCheck

  static-analysis:
    name: 'Stage 2: Static Analysis (Detekt)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Run Detekt Static Analysis
        run: ./gradlew :app:detekt

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: detekt-report
          path: app/build/reports/detekt/detekt.html
          retention-days: 14

  # ============================================================================
  # TIER 2: Testing & Platform Quality (Runs after Tier 1 passes)
  # ============================================================================
  unit-tests:
    name: 'Stage 3: Testing & Coverage'
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Run Unit, Robolectric & Konsist Tests with JaCoCo Coverage
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport

      - name: Publish JUnit Test Results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: 'Unit & Robolectric Test Results'
          path: 'app/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 14

  platform-lint:
    name: 'Stage 4: Platform Quality (Android Lint)'
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Run Android Lint (lintDebug)
        run: ./gradlew :app:lintDebug

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  # ============================================================================
  # TIER 3: Compilation & Packaging (Runs after Tier 2 passes)
  # ============================================================================
  build-apk:
    name: 'Stage 5: Build & Compilation'
    runs-on: ubuntu-latest
    needs: [unit-tests, platform-lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ============================================================================
  # TIER 4: Final Status Gate (Summary of All Quality Checks)
  # ============================================================================
  verification-summary:
    name: 'Verification Summary'
    runs-on: ubuntu-latest
    if: always()
    needs: [code-style, static-analysis, unit-tests, platform-lint, build-apk]
    steps:
      - name: Summarize Verification Results
        run: |
          echo "================================================================"
          echo "     PULL REQUEST VERIFICATION SUMMARY"
          echo "================================================================"
          echo ""
          echo "Stage 1 - Code Formatting (ktlint) : ${{ needs.code-style.result }}"
          echo "Stage 2 - Static Analysis (Detekt) : ${{ needs.static-analysis.result }}"
          echo "Stage 3 - Testing & Coverage       : ${{ needs.unit-tests.result }}"
          echo "Stage 4 - Platform Quality (Lint)  : ${{ needs.platform-lint.result }}"
          echo "Stage 5 - Build & Compilation      : ${{ needs.build-apk.result }}"
          echo ""
          echo "================================================================"

      - name: Fail If Any Stage Failed
        if: |
          needs.code-style.result != 'success' ||
          needs.static-analysis.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.platform-lint.result != 'success' ||
          needs.build-apk.result != 'success'
        run: |
          echo "❌ One or more verification stages failed. Pull request cannot be merged."
          exit 1

      - name: All Quality Gates Passed
        run: echo "✔ All 5 verification stages passed. Pull request is safe to merge."
